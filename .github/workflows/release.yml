name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.8.1)'
        required: true
        default: '2.8.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build Firefox extension
      run: npm run build
      
    - name: Build release packages
      run: npm run build-release
      
    - name: List files for debugging
      run: ls -la dist-release/ || echo "dist-release directory not found"
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: extension-packages
        path: dist-release/*.zip
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist-release/ggbuddy-chrome-*.zip
          dist-release/ggbuddy-firefox-*.zip
          dist-release/ggbuddy-chrome.zip
          dist-release/ggbuddy-firefox.zip
        generate_release_notes: false
        draft: false
        prerelease: false
        name: GG Buddy ${{ github.ref_name }}
        body: |
          ## GG Buddy ${{ github.ref_name }}

          See [CHANGELOG.md](https://github.com/Sn3akySl0th/gg-buddy/blob/main/CHANGELOG.md) for full notes.

          ### Store packages
          - **Chrome Web Store:** upload `ggbuddy-chrome-2.8.2.zip` (or the versioned zip matching this tag)
          - **Firefox Add-ons:** upload `ggbuddy-firefox-2.8.2.zip`

          ### What’s new (2.8.2)
          - Polished price bar on product pages (Official / Keyshop / Best, historical-low badge, minimize, per-site hide)
          - Import public GG.deals wishlist share links (all pages; runs in the background)
          - Unresolved titles list after import
          - Product-page gates (including Steam packages/bundles)

          ### Sideload / GitHub install
          Download the Chrome or Firefox zip from this release. See [GITHUB-INSTALL.md](https://github.com/Sn3akySl0th/gg-buddy/blob/main/GITHUB-INSTALL.md).
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
