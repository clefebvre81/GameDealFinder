name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.8.1)'
        required: true
        default: '2.8.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build Firefox extension
      run: npm run build
      
    - name: Build release packages
      run: npm run build-release
      
    - name: List files for debugging
      run: ls -la dist-release/ || echo "dist-release directory not found"
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: extension-packages
        path: dist-release/*.zip
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist-release/ggbuddy-chrome-*.zip
          dist-release/ggbuddy-firefox-*.zip
          dist-release/ggbuddy-chrome.zip
          dist-release/ggbuddy-firefox.zip
        generate_release_notes: false
        draft: false
        prerelease: false
        name: GG Buddy v${{ github.ref_name }}
        body: |
          ## GG Buddy v${{ github.ref_name }}
          
          ### Installation
          
          **Chrome Extension:**
          - Download `ggbuddy-chrome-${{ github.ref_name }}.zip`
          - Extract and load in Chrome developer mode
          
          **Firefox Extension:**
          - Download `ggbuddy-firefox-${{ github.ref_name }}.zip`
          - Extract and load in Firefox about:debugging
          
          ### Changes
          - Added GitHub installation support
          - Automated build and release system
          - Cross-platform compatibility improvements
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
